<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلة الطلاقة - مسار تطوير اللغة الإنجليزية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- إعداد Tailwind للوضع الليلي -->
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300 antialiased">

    <header class="bg-gradient-to-l from-blue-900 to-blue-700 dark:from-slate-800 dark:to-slate-950 text-white py-12 px-4 shadow-lg text-center rounded-b-3xl mb-8 relative">
        <div class="max-w-4xl mx-auto">
            
            <!-- زر التبديل والاسم -->
            <div class="flex justify-center items-center gap-4 mb-6">
                <div id="user-greeting-section" class="inline-flex items-center bg-white/10 px-5 py-2 rounded-full cursor-pointer border border-white/20" onclick="editUserName()">
                    <span id="user-name-display" class="font-bold text-lg">مرحباً بك! 👋</span>
                </div>
                <!-- زر الوضع الليلي -->
                <button onclick="toggleDarkMode()" class="p-2 rounded-full bg-white/10 hover:bg-white/20 transition-all border border-white/20">
                    <span id="theme-icon">🌙</span>
                </button>
            </div>

            <h1 class="text-4xl font-extrabold mt-4 mb-2">رحلة الطلاقة 🚀</h1>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pb-12">
        <!-- بقية الكود (العداد والمهام بنفس التنسيق) -->
        <!-- ملاحظة: عند إضافة أي كارد جديد استخدم الألوان المتوافقة مع الليلي: bg-white dark:bg-slate-800 -->
        
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-md p-6 mb-8 border dark:border-slate-700">
             <h2 class="text-xl font-bold mb-4">متتبع الإنجاز اليومي</h2>
             <!-- أضف المهام هنا بنفس الطريقة السابقة -->
        </div>

    </main>

    <script>
        // دالة الوضع الليلي
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('theme-icon').innerText = isDark ? '☀️' : '🌙';
        }

        // تشغيل الإعدادات عند التحميل
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-icon').innerText = '☀️';
        } else {
            document.documentElement.classList.remove('dark');
            document.getElementById('theme-icon').innerText = '🌙';
        }

        // ... بقية دوال حفظ الاسم والمهام ...
    </script>
</body>
</html>
